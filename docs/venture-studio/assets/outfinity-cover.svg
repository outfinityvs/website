    <radialGradient id="cover-core-surface" cx="42%" cy="36%" r="70%"><stop stop-color="#15302f"/><stop offset=".52" stop-color="#0a1a1a"/><stop offset="1" stop-color="#061111"/></radialGradient>
    <radialGradient id="cover-planet-teal" cx="36%" cy="28%" r="72%"><stop stop-color="#18403e"/><stop offset=".48" stop-color="#0b2221"/><stop offset="1" stop-color="#061313"/></radialGradient>
